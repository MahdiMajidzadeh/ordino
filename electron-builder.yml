appId: com.ordino.app
productName: Ordino
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,requirements.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.claude/*'
asarUnpack:
  - resources/**

win:
  executableName: Ordino
  target:
    - nsis
  # --- Code signing (Phase 3 placeholder) ---------------------------------
  # Provide a certificate before shipping publicly. Options:
  #   certificateFile / certificatePassword (PFX), or Azure Trusted Signing:
  # azureSignOptions:
  #   publisherName: ...
  #   endpoint: ...
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  target:
    - dmg
    - zip # required by electron-updater on macOS
  category: public.app-category.utilities
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Ordino organizes files in folders you choose.
    - NSDownloadsFolderUsageDescription: Ordino organizes files in folders you choose.
    - NSDesktopFolderUsageDescription: Ordino organizes files in folders you choose.
  # --- Signing & notarization (Phase 3 placeholder) -----------------------
  # With a Developer ID certificate installed, flip:
  # hardenedRuntime: true
  # notarize: true    # needs APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - deb
  maintainer: Mahdi Majidzadeh
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false

# --- Auto-update feed (M9 scaffold) ---------------------------------------
# Point at the real GitHub repo before the first public release; releases
# published there feed electron-updater.
publish:
  provider: github
  owner: mahdimajidzadeh
  repo: ordino
